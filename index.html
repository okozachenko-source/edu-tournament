<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard · Turbo Stars</title>
<meta name="description" content="Live tournament standings.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ── Brand ── set the accent here, it propagates everywhere ── */
    --brand:#FF6A00;
    --brand-hi:#FF8324;
    --brand-soft:rgba(255,106,0,.12);
    --brand-line:rgba(255,106,0,.38);

    --bg:#000000;
    --surface:#0E0E10;
    --surface-hi:#161619;
    --plate:#0A0A0C;
    --border:#26262B;
    --text:#FFFFFF;
    --muted:#8B8B93;
    --dim:#5A5A62;
    --up:#3DBE7C;
    --down:#E2564C;

    --plate-w:80px;
    --maxw:840px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-weight:500;-webkit-font-smoothing:antialiased;
    padding:0 16px 72px;
  }
  .wrap{max-width:var(--maxw);margin:0 auto}

  /* ── Masthead ── */
  .masthead{padding:40px 0 22px;border-bottom:1px solid var(--border)}
  .brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .logo{height:30px;width:auto;display:block}
  .stamp{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;
         letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .stamp b{color:var(--text);font-weight:600}

  h1{font-weight:800;font-size:clamp(30px,6.4vw,50px);line-height:1.04;
     letter-spacing:-.025em;margin:0}
  .sub{margin:12px 0 0;color:var(--muted);font-size:14.5px;font-weight:500;line-height:1.55;max-width:56ch}

  /* ── Controls ── */
  .controls{display:flex;gap:10px;align-items:center;padding:20px 0 14px;flex-wrap:wrap}
  .search{position:relative;flex:1 1 220px}
  .search input{
    width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:11px 13px 11px 38px;font-size:14px;font-weight:500;font-family:inherit;
  }
  .search input::placeholder{color:var(--dim)}
  .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);stroke:var(--dim)}

  .btn{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:11px 15px;font-family:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .btn:hover{background:var(--surface-hi);border-color:#33333A}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btn[aria-busy="true"]{color:var(--muted);pointer-events:none}
  .btn svg{stroke:currentColor}
  .count{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;white-space:nowrap}

  /* ── Rows ── */
  .row{
    display:grid;grid-template-columns:var(--plate-w) 1fr auto;align-items:stretch;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    margin-bottom:6px;min-height:62px;overflow:hidden;
  }
  .row:hover{background:var(--surface-hi)}
  .plate{
    display:flex;align-items:center;justify-content:center;background:var(--plate);
    border-right:1px solid var(--border);font-weight:800;font-size:26px;line-height:1;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text);
  }
  .name{display:flex;align-items:center;padding:12px 16px;font-size:16px;font-weight:600;
        letter-spacing:-.01em;word-break:break-word;min-width:0}
  .name mark{background:var(--brand-soft);color:var(--brand-hi);border-radius:2px;padding:0 2px}
  .meta{display:flex;align-items:center;gap:14px;padding:0 16px 0 8px;flex:none}
  .delta{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--dim);
         font-variant-numeric:tabular-nums;white-space:nowrap}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)}
  .note{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
        color:var(--muted);white-space:nowrap}

  /* Leader — the only place the brand orange is used as a fill */
  .row.p1{border-color:var(--brand-line);min-height:76px}
  .row.p1 .plate{background:var(--brand);color:#140600;font-size:31px;border-right-color:var(--brand)}
  .row.p1 .name{font-size:19px;font-weight:700}
  .row.p2,.row.p3{min-height:70px}
  .row.p2 .plate,.row.p3 .plate{font-size:28px}
  .row.p2 .name,.row.p3 .name{font-size:17px;font-weight:700}

  /* ── States ── */
  .state{border:1px dashed var(--border);border-radius:8px;padding:44px 24px;text-align:center;
         color:var(--muted);font-size:14.5px;font-weight:500;line-height:1.6}
  .state b{display:block;color:var(--text);font-weight:700;font-size:19px;
           letter-spacing:-.015em;margin-bottom:8px}
  .foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);
        display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
        font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}

  @media (max-width:560px){
    :root{--plate-w:60px}
    .plate{font-size:22px}
    .row.p1 .plate{font-size:25px}
    .row.p2 .plate,.row.p3 .plate{font-size:23px}
    .name{font-size:14.5px;padding:10px 12px}
    .row.p1 .name{font-size:16px}
    .row.p2 .name,.row.p3 .name{font-size:15px}
    .note{display:none}
    .meta{padding-right:12px;gap:10px}
    .logo{height:24px}
    .masthead{padding-top:28px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brandbar">
      <img class="logo" id="logo" src="logo.png" alt="Turbo Stars">
      <div class="stamp">Updated <b id="updated">…</b></div>
    </div>
    <h1 id="title">Leaderboard</h1>
    <p class="sub" id="subtitle" hidden></p>
  </header>

  <div class="controls">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
      </svg>
      <input id="q" type="search" placeholder="Search participants" aria-label="Search participants" autocomplete="off">
    </div>
    <div class="count" id="count"></div>
  </div>

  <main id="board" aria-live="polite">
    <div class="state"><b>Loading</b>Reading the standings.</div>
  </main>

  <footer class="foot">
    <span id="foot-right"></span>
  </footer>

</div>

<script>
(() => {
  "use strict";
  const DATA_URL = "data.json";
  const $ = (id) => document.getElementById(id);
  const board = $("board");
  let state = { participants: [] };
  let query = "";

  const esc = (s) => String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  function highlight(name, q){
    const safe = esc(name);
    if (!q) return safe;
    const i = safe.toLowerCase().indexOf(esc(q).toLowerCase());
    if (i < 0) return safe;
    const n = esc(q).length;
    return safe.slice(0,i) + "<mark>" + safe.slice(i,i+n) + "</mark>" + safe.slice(i+n);
  }

  function deltaHTML(p){
    if (p.prevPosition == null) return '<span class="delta">NEW</span>';
    if (p.prevPosition === p.position) return '<span class="delta">—</span>';
    const d = p.prevPosition - p.position;
    return `<span class="delta ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d)}</span>`;
  }

  function fmtTime(iso){
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleString("en-GB",{ day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
  }

  function render(){
    const all = (state.participants || []).slice()
      .sort((a,b) => (a.position || 9e9) - (b.position || 9e9));
    const q = query.trim().toLowerCase();
    const rows = q ? all.filter(p => (p.name || "").toLowerCase().includes(q)) : all;

    $("count").textContent = q
      ? `${rows.length} of ${all.length}`
      : `${all.length} ${all.length === 1 ? "participant" : "participants"}`;

    if (!all.length){
      board.innerHTML = '<div class="state"><b>No participants yet</b>Names appear here once they are added in the back office.</div>';
      return;
    }
    if (!rows.length){
      board.innerHTML = `<div class="state"><b>No match</b>Nothing found for “${esc(query)}”. Check the spelling.</div>`;
      return;
    }

    board.innerHTML = rows.map((p,i) => {
      const pos = p.position || (i+1);
      const cls = pos <= 3 ? ` p${pos}` : "";
      const note = p.note ? `<span class="note">${esc(p.note)}</span>` : "";
      return `<div class="row${cls}">
        <div class="plate">${String(pos).padStart(2,"0")}</div>
        <div class="name">${highlight(p.name || "—", query)}</div>
        <div class="meta">${note}${deltaHTML(p)}</div>
      </div>`;
    }).join("");
  }

  async function load(){
    try{
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache:"no-store" });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      state = data;

      if (data.title){ $("title").textContent = data.title; document.title = data.title + " · Turbo Stars"; }
      const sub = $("subtitle");
      sub.textContent = data.subtitle || "";
      sub.hidden = !data.subtitle;
      $("updated").textContent = fmtTime(data.updatedAt);
      $("foot-right").textContent = data.footer || "";
      render();
    }catch{
      board.innerHTML = '<div class="state"><b>Standings unavailable</b>The data file could not be read. Reload the page to try again.</div>';
      $("updated").textContent = "unavailable";
    }
  }

  $("q").addEventListener("input", e => { query = e.target.value; render(); });
  $("logo").addEventListener("error", e => e.target.remove());
  load();
})();
</script>
</body>
</html>
